<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端影音高速下载面板</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
        <h2 class="text-2xl font-bold mb-2 text-center text-blue-400">🚀 云端影音直链生成器</h2>
        <p class="text-sm text-slate-400 mb-6 text-center">输入视频网址，一键派发云端下载与转码任务</p>

        <div class="space-y-4">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">GitHub 用户名</label>
                    <input type="text" id="ghUser" value="xuanop" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">仓库名称</label>
                    <input type="text" id="ghRepo" value="Discord-Video-Storage-IN-xuan.cc" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">GitHub Personal Access Token (PAT)</label>
                <input type="password" id="ghToken" placeholder="输入你的 GitHub Token" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">视频网址 (YouTube / B站 / TikTok / 短链接)</label>
                <input type="text" id="videoUrl" placeholder="https://www.bilibili.com/video/..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <button onclick="triggerDownload()" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition-all shadow-lg shadow-blue-600/30 cursor-pointer">
                开始生成云端直链
            </button>
        </div>

        <div id="resultArea" class="mt-6 hidden">
            <div class="p-4 bg-slate-900 rounded-xl border border-slate-700 space-y-2">
                <p id="statusText" class="text-sm font-medium text-emerald-400">任务派发成功！</p>
                <p class="text-xs text-slate-400">视频正在云端高速下载与转码，请等待约 30 秒 - 1 分钟后点击下方链接：</p>
                <a id="downloadLink" href="#" target="_blank" class="block text-center bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium py-2 rounded-lg transition-all">
                    📥 点击下载最终视频文件
                </a>
            </div>
        </div>
    </div>

    <script>
        async function triggerDownload() {
            const user = document.getElementById('ghUser').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();
            const token = document.getElementById('ghToken').value.trim();
            const url = document.getElementById('videoUrl').value.trim();
            const btn = document.getElementById('submitBtn');
            const resultArea = document.getElementById('resultArea');
            const downloadLink = document.getElementById('downloadLink');

            if (!token || !url) {
                alert('请填写 GitHub Token 和视频网址！');
                return;
            }

            btn.disabled = true;
            btn.innerText = '正在派发任务...';

            const fileName = `video_${Math.floor(Date.now() / 1000)}.mp4`;
            const apiUrl = `https://api.github.com/repos/${user}/${repo}/actions/workflows/download.yml/dispatches`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github+json',
                        'X-GitHub-Api-Version': '2022-11-28'
                    },
                    body: JSON.stringify({
                        ref: 'main',
                        inputs: {
                            video_url: url,
                            file_name: fileName
                        }
                    })
                });

                if (response.status === 204) {
                    resultArea.classList.remove('hidden');
                    const directUrl = `https://github.com/${user}/${repo}/releases/download/v1.0.0/${fileName}`;
                    downloadLink.href = directUrl;
                } else {
                    const errData = await response.text();
                    alert('派发失败，请检查 Token 权限或输入是否正确。\n' + errData);
                }
            } catch (error) {
                alert('请求异常: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = '开始生成云端直链';
            }
        }
    </script>
</body>
</html>
