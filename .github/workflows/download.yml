name: Cloud Video Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '请输入要下载的视频网址'
        required: true
        type: string
      file_name:
        description: '指定保存的文件名'
        required: true
        type: string

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 强制安装并检查 FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          pip install --upgrade yt-dlp requests

      - name: 执行 yt-dlp 云端下载与最高画质 H.264 转码
        run: |
          python -c "
          import yt_dlp, os
          url = '${{ github.event.inputs.video_url }}'
          filename = '${{ github.event.inputs.file_name }}'
          os.makedirs('downloads', exist_ok=True)
          
          ydl_opts = {
              'format': 'bestvideo+bestaudio/best',
              'postprocessors': [{
                  'key': 'FFmpegVideoConvertor',
                  'preferedformat': 'mp4',
              }],
              'postprocessor_args': {
                  'ffmpeg': ['-c:v', 'libx264', '-c:a', 'aac', '-pix_fmt', 'yuv420p']
              },
              'outtmpl': os.path.join('downloads', filename),
              'ffmpeg_args': ['-y'],
          }
          with yt_dlp.YoutubeDL(ydl_opts) as ydl:
              ydl.download([url])
          "

      - name: 上传文件至 GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          files: downloads/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
