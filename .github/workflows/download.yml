name: Download Media and Notify Discord

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL to download'
        required: true
        type: string
      file_name:
        description: 'Target file name'
        required: true
        type: string
      interaction_token:
        description: 'Discord Interaction Token'
        required: true
        type: string
      application_id:
        description: 'Discord Application ID'
        required: true
        type: string

concurrency:
  group: download-${{ github.event.inputs.interaction_token }}
  cancel-in-progress: true

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system and python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade --no-cache-dir yt-dlp

      - name: Download media using yt-dlp
        id: download_step
        run: |
          python3 -c "
          import yt_dlp
          import glob
          import sys

          url = '${{ github.event.inputs.video_url }}'
          target_file = '${{ github.event.inputs.file_name }}'
          ext = target_file.split('.')[-1]

          ydl_opts = {
              'outtmpl': 'downloaded_file',
              'socket_timeout': 30,
              'geo_bypass': True,
          }

          if ext == 'mp3':
              ydl_opts['format'] = 'bestaudio/best'
              ydl_opts['postprocessors'] = [{
                  'key': 'FFmpegExtractAudio',
                  'preferredcodec': 'mp3',
                  'preferredquality': '192',
              }]
          else:
              ydl_opts['format'] = 'bestvideo+bestaudio/best'
              ydl_opts['merge_output_format'] = 'mp4'

          try:
              with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                  ydl.download([url])

              files = glob.glob('downloaded_file*')
              if files:
                  import shutil
                  shutil.move(files[0], target_file)
                  print(f'Successfully prepared file: {target_file}')
              else:
                  print('Error: No output file found.', file=sys.stderr)
                  sys.exit(1)
          except Exception as e:
              print(f'Download Error: {e}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Upload to GitHub Release
        id: release_step
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: ${{ github.event.inputs.file_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Discord Interaction Message (Result)
        if: always()
        env:
          APP_ID: ${{ github.event.inputs.application_id }}
          TOKEN: ${{ github.event.inputs.interaction_token }}
          FILE_NAME: ${{ github.event.inputs.file_name }}
          REPO: ${{ github.repository }}
          DOWNLOAD_STATUS: ${{ steps.download_step.outcome }}
          RELEASE_STATUS: ${{ steps.release_step.outcome }}
        run: |
          python3 -c "
          import os, urllib.request, json

          app_id = os.environ['APP_ID']
          token = os.environ['TOKEN']
          file_name = os.environ['FILE_NAME']
          repo = os.environ['REPO']
          
          download_status = os.environ['DOWNLOAD_STATUS']
          release_status = os.environ['RELEASE_STATUS']

          url = f'https://discord.com/api/v10/webhooks/{app_id}/{token}/messages/@original'

          if download_status == 'success' and release_status == 'success':
              direct_url = f'https://github.com/{repo}/releases/download/v1.0.0/{file_name}'
              payload = {
                  'content': f'✅ **视频下载并打包完成！**\n\n📥 [点击下载文件]({direct_url})'
              }
          else:
              payload = {
                  'content': f'❌ **下载或处理失败！**\n可能原因：链接无效、视频受版权/地区限制、或平台触发了反爬风控。'
              }

          req = urllib.request.Request(
              url, 
              data=json.dumps(payload).encode('utf-8'), 
              headers={
                  'Content-Type': 'application/json',
                  'User-Agent': 'DiscordBot'
              }, 
              method='PATCH'
          )

          try:
              with urllib.request.urlopen(req) as response:
                  print('Successfully updated Discord message:', response.read().decode())
          except Exception as e:
              print('Failed to update Discord message:', e)
          "
