name: Download Media and Notify Discord

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL to download'
        required: true
        type: string
      file_name:
        description: 'Target file name'
        required: true
        type: string
      interaction_token:
        description: 'Discord Interaction Token'
        required: true
        type: string
      application_id:
        description: 'Discord Application ID'
        required: true
        type: string

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system and python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          # 强制每次升级到最新版 yt-dlp，防止风控报错 412/403
          pip install --upgrade --no-cache-dir yt-dlp

      - name: Download media using yt-dlp
        run: |
          python3 -c "
          import yt_dlp
          import glob

          url = '${{ github.event.inputs.video_url }}'
          target_file = '${{ github.event.inputs.file_name }}'
          ext = target_file.split('.')[-1]

          ydl_opts = {
              'outtmpl': 'downloaded_file',
              'socket_timeout': 30,
              'geo_bypass': True,
          }

          if ext == 'mp3':
              ydl_opts['format'] = 'bestaudio/best'
              ydl_opts['postprocessors'] = [{
                  'key': 'FFmpegExtractAudio',
                  'preferredcodec': 'mp3',
                  'preferredquality': '192',
              }]
          else:
              ydl_opts['format'] = 'bestvideo+bestaudio/best'
              ydl_opts['merge_output_format'] = 'mp4'

          with yt_dlp.YoutubeDL(ydl_opts) as ydl:
              ydl.download([url])

          files = glob.glob('downloaded_file*')
          if files:
              import shutil
              shutil.move(files[0], target_file)
              print(f'Successfully prepared file: {target_file}')
          else:
              raise Exception('Download failed: No output file found.')
          "

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: ${{ github.event.inputs.file_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Discord Interaction Message
        if: always()
        run: |
          python3 -c "
          import os, urllib.request, json

          app_id = '${{ github.event.inputs.application_id }}'
          token = '${{ github.event.inputs.interaction_token }}'
          file_name = '${{ github.event.inputs.file_name }}'
          repo = '${{ github.repository }}'

          direct_url = f'https://github.com/{repo}/releases/download/v1.0.0/{file_name}'
          
          # 根据任务执行情况判断成功或失败
          # 这里通过检查 Release 文件是否存在来简单判定，或者根据步骤状态
          payload = {
              'content': f'✅ **下载已完成！**\n\n📥 [点击下载文件]({direct_url})'
          }

          url = f'https://discord.com/api/v10/webhooks/{app_id}/{token}/messages/@original'
          req = urllib.request.Request(
              url, 
              data=json.dumps(payload).encode('utf-8'), 
              headers={
                  'Content-Type': 'application/json',
                  'User-Agent': 'DiscordBot'
              }, 
              method='PATCH'
          )

          try:
              with urllib.request.urlopen(req) as response:
                  print('Successfully updated Discord message:', response.read().decode())
          except Exception as e:
              print('Failed to update Discord message:', e)
          "
