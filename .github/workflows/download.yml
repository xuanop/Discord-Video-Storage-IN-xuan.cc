name: Cloud Video Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '请输入要下载的视频网址'
        required: true
        type: string
      file_name:
        description: '指定保存的文件名'
        required: true
        type: string

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装并验证 FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          pip install --upgrade yt-dlp requests

      - name: 写入完整的 Netscape Cookie
        run: |
          echo "${{ secrets.BILI_COOKIE }}" > bili_cookies.txt

      - name: 打印可用画质清单并执行严格原画下载
        run: |
          python -c "
          import yt_dlp, os
          url = '${{ github.event.inputs.video_url }}'
          filename = '${{ github.event.inputs.file_name }}'
          os.makedirs('downloads', exist_ok=True)
          
          # 1. 先打印该视频在云端识别到的所有画质流，方便去 Actions 日志里查看
          print('=== 正在检测云端可用画质流 ===')
          with yt_dlp.YoutubeDL({'cookiefile': 'bili_cookies.txt', 'quiet': True}) as ydl:
              try:
                  info = ydl.extract_info(url, download=False)
                  formats = info.get('formats', [])
                  for f in formats:
                      print(f'Format ID: {f.get(\"format_id\")}, Resolution: {f.get(\"resolution\")}, Note: {f.get(\"format_note\")}, Ext: {f.get(\"ext\")}')
              except Exception as e:
                  print(f'获取画质列表失败: {e}')
          print('==============================')

          # 2. 强制使用最严苛的高画质合流策略（不容许降级）
          ydl_opts = {
              # 强制抓取最高画质视频 + 最高音质，如果找不到直接报错，绝不偷换低画质
              'format': 'bv*+ba/b',
              'cookiefile': 'bili_cookies.txt',
              'merge_output_format': 'mp4',
              'postprocessors': [{
                  'key': 'FFmpegVideoConvertor',
                  'preferedformat': 'mp4',
              }],
              'postprocessor_args': {
                  'ffmpeg': ['-c:v', 'libx264', '-c:a', 'aac', '-pix_fmt', 'yuv420p', '-crf', '18']
              },
              'outtmpl': os.path.join('downloads', filename),
              'ffmpeg_args': ['-y'],
              'http_headers': {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
                  'Referer': 'https://www.bilibili.com',
                  'Accept-Language': 'zh-CN,zh;q=0.9',
              }
          }
          with yt_dlp.YoutubeDL(ydl_opts) as ydl:
              ydl.download([url])
          "

      - name: 上传文件至 GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          files: downloads/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
